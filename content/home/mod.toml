# codecs-lab as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `codecs_lab-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "d680cff4-488c-4670-a957-a02fa177b21b"
slug = "codecs_lab"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.codecs-lab"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
