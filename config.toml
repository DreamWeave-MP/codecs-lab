base_url = "https://dreamweave-mp.github.io/codecs-lab"
title = "codecs-lab"
description = "Compression research for Jess and l3i: interoperable Luau codecs, pure and hybrid, measured against the native @dream/bytes bindings."
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
github_username = "DreamWeave-MP"
github_project = "codecs-lab"
logo_text = "codecs-lab"
palette = "slate"
menu_items = [
    { name = "codecs-lab", url = "@/home/index.md" },
    { name = "Network", url = "@/network.md" },
]

[extra.comments]
enabled = false
category = "General"
